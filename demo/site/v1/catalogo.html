<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brasa · Cafés</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><script src="https://vistazo-pi.vercel.app/bridge.js" defer></script></head>
<body><header data-header></header><main><h1>Cafés de esta semana</h1><p class="muted">Tostados el lunes. Envío en 48 h.</p><div class="grid" id="g"></div></main><p class="foot">Brasa Tostadores es una <b>empresa ficticia</b> · datos sintéticos para demo de Vistazo · <span data-version></span></p>
<script>guard();g.innerHTML=PRODUCTS.map(p=>`<article class="card" data-testid="product-${p.id}"><div class="img" style="background:${p.img}"></div><div class="body"><h3>${p.name}</h3><p class="muted" style="margin:4px 0;font-size:14px">${p.notes}</p><p class="price">${fmt(p.price)}</p><button class="btn light" data-testid="add-${p.id}" onclick="const c=store.cart;c['${p.id}']=(c['${p.id}']||0)+1;store.cart=c;header();this.textContent='Añadido ✓'">Añadir</button></div></article>`).join("")</script></body></html>
