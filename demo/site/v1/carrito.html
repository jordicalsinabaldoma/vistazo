<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brasa · Carrito</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><script src="https://vistazo-pi.vercel.app/bridge.js" defer></script></head>
<body><header data-header></header><main><h1>Tu carrito</h1><div class="panel" style="max-width:560px" id="c"></div></main><p class="foot">Brasa Tostadores es una <b>empresa ficticia</b> · datos sintéticos para demo de Vistazo · <span data-version></span></p>
<script>guard();const items=Object.entries(store.cart).map(([id,q])=>({...PRODUCTS.find(p=>p.id===id),q}));const total=items.reduce((a,i)=>a+i.price*i.q,0);
c.innerHTML=items.length?items.map(i=>`<div class="row"><span>${i.q} × ${i.name}</span><span>${fmt(Math.round(i.price*i.q*100)/100)}</span></div>`).join("")+`<div class="row" data-testid="total"><b>Total</b><b>${fmt(Math.round(total*100)/100)}</b></div><p style="margin-top:18px"><a class="btn" href="pago.html" data-testid="checkout">Ir al pago</a></p>`:'<p class="muted">Tu carrito está vacío.</p><a class="btn light" href="catalogo.html">Ver cafés</a>'</script></body></html>
